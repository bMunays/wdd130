<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz about HTML and CSS</title>

    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>

    </header>
    <main>
        <h1>Online Quiz about HTML and CSS</h1>
        <form action="">
            <div class="quiz-item">
                <label for="q1">1. What does the acronym CSS stand for?</label>
                <input type="text" name="q1" id="question1">
            </div>
            <div class="quiz-item">
                <label for="q2">2. How are id and class attributes selected in CSS?</label>
                <textarea name="q2" id="q2"></textarea>
            </div>
            <div class="quiz-item">
                <label for="q3">3. Which of the following is a valid CSS comment?</label>
                <select type="text" id="q3" name="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="a">&lt;!--This is a comment--&lt;</option>
                    <option value="b">/* This is a comment* /</option>
                    <option value="c">// This is a comment</option>
                </select>
            </div>
            <div class="quiz-item">
                <label for="q4">4. What is the bottom margin given this declaration?</label>
                <input type="number" name="q4" id="q4">
            </div>

            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer>

    </footer>

</body>

</html>
