<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Get in touch with us for general inquiries, reservation questions, or website suggestions. Contact our team directly via phone, email, or our online form.">
    <meta name="author" content="Brighton Munezi">
    <title>Contact Us - River Flow Adventures</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-wwr-blue.jpg" alt="River Flow Adventures logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>

        </nav>
    </header>
    <main>
        <!-- Company Information -->
        <div class="company-info">
            <h1>White Water Rafting Company</h1>
            <p>
                123 Main River Street<br>
                Kolob, California<br>
                +1 999 999 9999<br>
                info@whitewater.com
            </p>
        </div>

        <!-- Map and Form Grid -->
        <div class="contact-grid">
            <div class="map-container">
                <!-- Embedded Google Map -->
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d101297.80931526369!2d-113.25055050853828!3d37.498867375267445!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80ca5c8b665c8293%3A0xc39116e0388d1d86!2sKolob%20Canyons!5e0!3m2!1sen!2sus!4v1699999999999!5m2!1sen!2sus"
                  height="400" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <div class="form-container">
                <form action="#" method="get" class="contact-form">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Placeholder" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Placeholder"
                          required>
                    </div>

                    <div class="form-group purpose-group">
                        <p class="purpose-label">Message<br>Purpose</p>
                        <div class="radio-options">
                            <label for="general">
                                <input type="radio" id="general" name="purpose" value="general"
                                  checked> General Inquiry
                            </label>
                            <label for="reservation">
                                <input type="radio" id="reservation" name="purpose"
                                  value="reservation"> Reservation
                                Question
                            </label>
                            <label for="website">
                                <input type="radio" id="website" name="purpose" value="website">
                                Website Suggestion
                            </label>
                        </div>
                    </div>

                    <div class="form-group message-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4" placeholder="Type here"
                          required></textarea>
                    </div>

                    <div class="checkbox-group">
                        <label for="newsletter">
                            <input type="checkbox" id="newsletter" name="newsletter"
                              value="subscribe" checked> Please Subscribe me to the monthly
                            newsletter
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">Get in Touch!</button>
                </form>
            </div>
        </div>

        <!-- Employee Profiles -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-gallery">
                <figure>
                    <img src="images/employee1.webp" alt="Employee Profile - Guide">
                    <figcaption>Jane Doe<br>Lead River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.webp" alt="Employee Profile - Manager">
                    <figcaption>John Smith<br>Reservations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.webp" alt="Employee Profile - Safety">
                    <figcaption>Alex Johnson<br>Safety Director</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <hr> <!-- divider -->
    <footer>
        <p>&copy; 2026 | River Flow Adventures | Brighton Munezi</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook-square.svg" alt="Facebook"></a>
            <a href="https://instagram.com"><img src="images/instagram-square.svg"
                  alt="Instagram"></a>
            <a href="https://youtube.com"><img src="images/youtube-square.svg" alt="YouTube"></a>
        </nav>
    </footer>
</body>

</html>
